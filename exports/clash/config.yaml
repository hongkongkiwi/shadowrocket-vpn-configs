rules:
  # AI first (broadest list wins)
  - RULE-SET,ai-vpsdance,🤖 AI
  - RULE-SET,ai-openai,🤖 AI
  - RULE-SET,ai-claude,🤖 AI
  # Ads — module-equivalent, comment out to disable
  - RULE-SET,ads,REJECT
  # LAN
  - RULE-SET,lan,DIRECT
  # Services
  - RULE-SET,telegram,📟 Telegram Messages
  - RULE-SET,twitter,🐦 Twitter Messages
  - RULE-SET,github,🖥️ Microsoft Services
  - RULE-SET,onedrive,🖥️ Microsoft Services
  - RULE-SET,microsoft,🖥️ Microsoft Services
  - RULE-SET,youtube,🌌 Google Services
  - RULE-SET,google,🌌 Google Services
  - RULE-SET,spotify,🎵 Spotify
  - RULE-SET,bahamut,📽️ International Media
  - RULE-SET,netflix,📽️ International Media
  - RULE-SET,disney,📽️ International Media
  - RULE-SET,primevideo,📽️ International Media
  - RULE-SET,hbo,📽️ International Media
  - RULE-SET,tiktok,📱 TikTok
  - RULE-SET,emby,📽️ Emby
  - RULE-SET,steam,🎮 Gaming Platforms
  - RULE-SET,epic,🎮 Gaming Platforms
  # Apple push first, rest of Apple after (mirrors Apple-Push + AppleCN/AppleServers order)
  - RULE-SET,apple,🍎 Apple Services
  - RULE-SET,applecn,🍎 Apple Services
  # Apple Intelligence / Private Cloud Compute / iCloud gateway - keep DIRECT
  - DOMAIN-SUFFIX,gateway.icloud.com,DIRECT
  - DOMAIN,apple-relay.cloudflare.com,DIRECT
  - DOMAIN,cp4.cloudflare.com,DIRECT
  - DOMAIN,apple-relay.fastly-edge.com,DIRECT
  - DOMAIN,gdmf.apple.com,DIRECT
  - DOMAIN,swscan.apple.com,DIRECT
  # CN direct (domain first, then geo fallback)
  - RULE-SET,chinadirect,DIRECT
  - RULE-SET,cn-ip,DIRECT,no-resolve
  # Proxy catch-all before final (mirrors Proxy.list role)
  - RULE-SET,geolocation-not-cn,🌍 Foreign Websites
  - MATCH,🐟 Fallback Routing
