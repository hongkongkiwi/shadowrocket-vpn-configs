# mihomo / Clash.Meta / Clash Verge Rev / Stash config
# Port of shadowrocket.conf routing intent using mihomo provider formats.
# Rule sources: blackmatrix7 (Clash yaml payload format) + MetaCubeX meta-rules-dat (.mrs binaries).
# Merge this file with the profile that supplies your proxies. Separate profile cards
# do not combine nodes, groups, providers, or rules.
#
# NOTE on DNS: mihomo does its own DNS. The fake-IP exclusions keep selected
# LAN, connectivity-check, gaming, carrier, and Apple hosts on real addresses.

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

geodata-mode: false          # use .mrs rule-providers below, not geo databases

dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  # Used only to resolve DoH hostnames before the encrypted resolvers are ready.
  default-nameserver:
    - "1.1.1.1"
    - "9.9.9.9"
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "xbox.*.microsoft.com"
    - "+.xboxlive.com"
    - "+.logon.battlenet.com.cn"
    - "+.logon.battle.net"
    - "stun.l.google.com"
    - "gateway.icloud.com"
    - "apple-relay.cloudflare.com"
    - "cp4.cloudflare.com"
    - "apple-relay.fastly-edge.com"
    - "+.cmpassport.com"
    - "id6.me"
    - "open.e.189.cn"
    - "mdn.open.wo.cn"
    - "opencloud.wostore.cn"
    - "auth.wosms.cn"
    - "+.10099.com.cn"
  nameserver:
    - "https://1.1.1.1/dns-query"
    - "https://dns.quad9.net/dns-query"

proxy-groups:
  # PROXY = every node from your imported subscription (include-all)
  - name: "PROXY"
    type: select
    include-all: true
  - name: "🌍 Foreign Websites"
