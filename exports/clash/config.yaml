# mihomo / Clash.Meta / Clash Verge Rev / Stash config
# Mirror of shadowrocket.conf — same groups, same rule sources.
# Rule sources: blackmatrix7 (Clash yaml payload format) + MetaCubeX meta-rules-dat (.mrs binaries).
# Add your subscription: Clash Verge → Profiles → import your airport's subscription,
# then add this file as a second profile or merge it (proxy-groups reference proxies by name).
#
# NOTE on DNS: mihomo does its own DNS. fake-ip + nameservers below are standard
# China setup (AliDNS + Tencent DoH). With fake-ip-filter covering Apple push etc.

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

geodata-mode: false          # use .mrs rule-providers below, not geo databases
geox-url:
  geoip: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.dat"
  geosite: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geosite.dat"

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.srv.nintendo.net"
    - "+.stun.playstation.net"
    - "xbox.*.microsoft.com"
    - "+.xboxlive.com"
    - "+.logon.battlenet.com.cn"
    - "+.logon.battle.net"
    - "stun.l.google.com"
    - "gateway.icloud.com"
    - "apple-relay.cloudflare.com"
    - "cp4.cloudflare.com"
    - "apple-relay.fastly-edge.com"
    - "+.cmpassport.com"
    - "id6.me"
    - "open.e.189.cn"
    - "mdn.open.wo.cn"
    - "opencloud.wostore.cn"
    - "auth.wosms.cn"
    - "+.10099.com.cn"
  nameserver:
    - "https://doh.pub/dns-query"
    - "https://dns.alidns.com/dns-query"
    - "223.5.5.5"
    - "119.29.29.29"

proxy-groups:
  # PROXY = every node from your imported subscription (include-all)
  - name: "PROXY"
    type: select
    include-all: true
  - name: "🌍 Foreign Websites"
    type: select
    proxies: [PROXY, 🇭🇰 Hong Kong Node, 🇺🇸 US Node, 🇸🇬 Singapore Node, 🇯🇵 Japan Node, 🇨🇳 Taiwan Node]
  - name: "📽️ International Media"
    type: select
    proxies: [PROXY, 🇭🇰 Hong Kong Node, 🇺🇸 US Node, 🇸🇬 Singapore Node, 🇯🇵 Japan Node, 🇨🇳 Taiwan Node]
  - name: "📱 TikTok"
    type: select
    proxies: [🇺🇸 US Node, PROXY, 🇸🇬 Singapore Node, 🇯🇵 Japan Node, 🇭🇰 Hong Kong Node, 🇨🇳 Taiwan Node, DIRECT]
  - name: "🖥️ Microsoft Services"
    type: select
    proxies: [PROXY, 🇭🇰 Hong Kong Node, 🇺🇸 US Node, 🇸🇬 Singapore Node, 🇯🇵 Japan Node, 🇨🇳 Taiwan Node]
  - name: "🌌 Google Services"
    type: select
    proxies: [PROXY, 🇭🇰 Hong Kong Node, 🇺🇸 US Node, 🇸🇬 Singapore Node, 🇯🇵 Japan Node, 🇨🇳 Taiwan Node]
  - name: "📟 Telegram Messages"
    type: select
    proxies: [PROXY, 🇭🇰 Hong Kong Node, 🇺🇸 US Node, 🇸🇬 Singapore Node, 🇯🇵 Japan Node, 🇨🇳 Taiwan Node]
  - name: "🐦 Twitter Messages"
    type: select
    proxies: [PROXY, 🇭🇰 Hong Kong Node, 🇺🇸 US Node, 🇸🇬 Singapore Node, 🇯🇵 Japan Node, 🇨🇳 Taiwan Node]
  - name: "🤖 AI"
    type: select
    proxies: [PROXY, 🇺🇸 US Node, 🇸🇬 Singapore Node, 🇯🇵 Japan Node, 🇭🇰 Hong Kong Node, 🇨🇳 Taiwan Node]
  - name: "🎮 Gaming Platforms"
    type: select
    proxies: [PROXY, 🇭🇰 Hong Kong Node, 🇺🇸 US Node, 🇸🇬 Singapore Node, 🇯🇵 Japan Node, 🇨🇳 Taiwan Node]
  - name: "📽️ Emby"
    type: select
    proxies: [PROXY, 🇭🇰 Hong Kong Node, 🇺🇸 US Node, 🇸🇬 Singapore Node, 🇯🇵 Japan Node, 🇨🇳 Taiwan Node, DIRECT]
  - name: "🎵 Spotify"
    type: select
    proxies: [PROXY, 🇭🇰 Hong Kong Node, 🇺🇸 US Node, 🇸🇬 Singapore Node, 🇯🇵 Japan Node, 🇨🇳 Taiwan Node]
  - name: "🍎 Apple Services"
    type: select
    proxies: [DIRECT, PROXY, 🇭🇰 Hong Kong Node, 🇺🇸 US Node]
  - name: "🐟 Fallback Routing"
    type: select
    proxies: [PROXY, 🇭🇰 Hong Kong Node, 🇺🇸 US Node, 🇸🇬 Singapore Node, 🇯🇵 Japan Node, 🇨🇳 Taiwan Node, DIRECT]
  - name: "🇭🇰 Hong Kong Node"
    type: url-test
    url: "http://1.1.1.1/generate_204"
    interval: 300
    tolerance: 50
    include-all: true
    filter: "(?i)🇭🇰|香港|(\\b(HK|Hong)\\b)"
  - name: "🇺🇸 US Node"
    type: url-test
    url: "http://1.1.1.1/generate_204"
    interval: 300
    tolerance: 50
    include-all: true
    filter: "(?i)🇺🇸|美国|洛杉矶|圣何塞|(\\b(US|United States)\\b)"
  - name: "🇸🇬 Singapore Node"
    type: url-test
    url: "http://1.1.1.1/generate_204"
    interval: 300
    tolerance: 50
    include-all: true
    filter: "(?i)🇸🇬|新加坡|狮|(\\b(SG|Singapore)\\b)"
  - name: "🇯🇵 Japan Node"
    type: url-test
    url: "http://1.1.1.1/generate_204"
    interval: 300
    tolerance: 50
    include-all: true
    filter: "(?i)🇯🇵|日本|东京|(\\b(JP|Japan)\\b)"
  - name: "🇨🇳 Taiwan Node"
    type: url-test
    url: "http://1.1.1.1/generate_204"
    interval: 300
    tolerance: 50
    include-all: true
    filter: "(?i)🇨🇳|🇹🇼|台湾|(\\b(TW|Tai|Taiwan)\\b)"

