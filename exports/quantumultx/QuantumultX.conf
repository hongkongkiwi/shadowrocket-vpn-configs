static=🚀 Final, proxy, 🇭🇰 Hong Kong Node, 🇺🇸 US Node, 🇸🇬 Singapore Node, 🇯🇵 Japan Node, 🇨🇳 Taiwan Node, direct
url-test=🇭🇰 Hong Kong Node, server_tag_regex=(?i)🇭🇰|香港|(\b(HK|Hong)\b), server_check_url=http://1.1.1.1/generate_204, server_check_timeout=5000, tolerance=0
url-test=🇺🇸 US Node, server_tag_regex=(?i)🇺🇸|美国|洛杉矶|圣何塞|(\b(US|United States)\b), server_check_url=http://1.1.1.1/generate_204, server_check_timeout=5000, tolerance=0
url-test=🇸🇬 Singapore Node, server_tag_regex=(?i)🇸🇬|新加坡|狮|(\b(SG|Singapore)\b), server_check_url=http://1.1.1.1/generate_204, server_check_timeout=5000, tolerance=0
url-test=🇯🇵 Japan Node, server_tag_regex=(?i)🇯🇵|日本|东京|(\b(JP|Japan)\b), server_check_url=http://1.1.1.1/generate_204, server_check_timeout=5000, tolerance=0
url-test=🇨🇳 Taiwan Node, server_tag_regex=(?i)🇨🇳|🇹🇼|台湾|(\b(TW|Tai|Taiwan)\b), server_check_url=http://1.1.1.1/generate_204, server_check_timeout=5000, tolerance=0

