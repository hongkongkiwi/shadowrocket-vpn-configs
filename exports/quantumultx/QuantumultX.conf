; Quantumult X config — mirror of shadowrocket.conf
; blackmatrix7 publishes QuantumultX-format lists where each rule line embeds its
; policy name (e.g. "HOST,x,Netflix") — so group names below MUST match those tags exactly.
; Import: QX → Settings → Config → Download, or paste via iTunes/Files.
; NOTE: QX changes syntax across versions occasionally — if a key errors on load,
; check it against the in-app documentation.

[general]
server_check_url = http://1.1.1.1/generate_204
server_check_timeout = 5000
excluded_routes = 192.168.0.0, 10.0.0.0, 172.16.0.0, 127.0.0.0, 100.64.0.0/10
icmp_auto_reply = true

[dns]
server = 119.29.29.29
server = 223.5.5.5
; consider adding doh-server entries, e.g.:
; doh-server = https://doh.pub/dns-query, https://dns.alidns.com/dns-query

[policy]
; your subscription nodes appear under "proxy" once added in QX → Server
static=🌏 Foreign Websites, proxy, 🇭🇰 Hong Kong Node, 🇺🇸 US Node, 🇸🇬 Singapore Node, 🇯🇵 Japan Node, 🇨🇳 Taiwan Node
static=🤖 AI, proxy, 🇺🇸 US Node, 🇸🇬 Singapore Node, 🇯🇵 Japan Node, 🇭🇰 Hong Kong Node, 🇨🇳 Taiwan Node
