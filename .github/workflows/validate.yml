name: Validate configs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - run: ruby scripts/validate_soul_module.rb
      - run: ruby scripts/validate_configs.rb
      - run: ruby scripts/audit_remote_sources.rb --self-test
